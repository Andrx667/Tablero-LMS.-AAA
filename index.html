    <!-- Fuentes y Iconos (Cargan sin bloquear la página) -->

    <style>
        /* COLORES Y VARIABLES */
        :root {
            --primary: #0284c7; 
            --dark: #0f172a;
            --light: #f8fafc;
            --gray: #64748b;
            --border: #e2e8f0;
            --font-main: 'Inter', sans-serif;
        }

        /* DISEÑO BASE MINIMALISTA */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: var(--font-main); }
        body { background-color: var(--light); color: var(--dark); line-height: 1.6; }
        
        /* NAVBAR ELEGANTE */
        header { background-color: white; border-bottom: 1px solid var(--border); padding: 1rem 0; }
        nav { max-width: 1200px; margin: 0 auto; padding: 0 2rem; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.5rem; font-weight: 800; color: var(--dark); text-decoration: none; display: flex; align-items: center; gap: 10px; }
        .logo img { height: 40px; border-radius: 6px; background-color: var(--light); } /* Carga el logo */
        .logo span { color: var(--primary); }
        .nav-links { display: flex; gap: 2rem; align-items: center; }
        .nav-links a { text-decoration: none; color: var(--gray); font-weight: 600; }
        .nav-links a:hover { color: var(--primary); }

        /* BOTONES GLOBALES */
        .btn { padding: 0.6rem 1.5rem; border-radius: 6px; font-weight: 600; text-decoration: none; cursor: pointer; border: none; text-align: center; display: inline-block; }
        .btn-outline { background: white; border: 2px solid var(--primary); color: var(--primary); }
        .btn-outline:hover { background: var(--light); }
        .btn-solid { background: var(--primary); color: white; border: 2px solid var(--primary); }
        .btn-solid:hover { background: #0369a1; border-color: #0369a1; }
        .user-avatar { width: 40px; height: 40px; background-color: var(--primary); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; cursor: pointer; }

        /* HERO SECTION (Sin imágenes de fondo complejas, puro minimalismo) */
        .hero { background-color: white; padding: 6rem 2rem; text-align: center; border-bottom: 1px solid var(--border); }
        .hero h1 { font-size: 3.5rem; margin-bottom: 1.5rem; color: var(--dark); font-weight: 800; max-width: 900px; margin-inline: auto; line-height: 1.2; }
        .hero p { font-size: 1.2rem; color: var(--gray); margin-bottom: 2.5rem; max-width: 600px; margin-inline: auto; }

        /* SECCIONES Y CONTENEDORES */
        .container { max-width: 1200px; margin: 0 auto; padding: 5rem 2rem; }
        .section-title { font-size: 2.2rem; margin-bottom: 3rem; text-align: center; font-weight: 800; }
