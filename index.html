        :root {
            --primary: #0284c7; 
            --dark: #0f172a;
            --light: #f8fafc;
            --gray: #64748b;
            --border: #e2e8f0;
            --font-main: 'Inter', sans-serif;
        }

        /* Reseteo Básico y Limpio */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: var(--font-main); }
        body { background-color: var(--light); color: var(--dark); line-height: 1.6; }

        /* Navegación Minimalista */
        header { background-color: white; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
        nav { max-width: 1200px; margin: 0 auto; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.5rem; font-weight: 800; color: var(--dark); text-decoration: none; display: flex; align-items: center; gap: 10px; }
        .logo img { height: 40px; border-radius: 6px; }
        .logo span { color: var(--primary); }
        
        .nav-links { display: flex; gap: 2rem; align-items: center; }
        .nav-links a { text-decoration: none; color: var(--gray); font-weight: 600; }
        .nav-links a:hover { color: var(--primary); }
        
        /* Botones Sencillos y Elegantes */
        .btn { padding: 0.6rem 1.2rem; border-radius: 6px; font-weight: 600; text-decoration: none; cursor: pointer; border: none; display: inline-block; text-align: center; }
        .btn-outline { background: white; border: 2px solid var(--primary); color: var(--primary); }
        .btn-outline:hover { background: var(--light); }
        .btn-solid { background: var(--primary); color: white; border: 2px solid var(--primary); }
        .btn-solid:hover { background: #0369a1; border-color: #0369a1; }

        /* Avatar de Usuario Logueado */
        .user-avatar { width: 40px; height: 40px; background-color: var(--primary); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; cursor: pointer; }

        /* Sección Hero */
        .hero { background-color: white; padding: 6rem 2rem; text-align: center; border-bottom: 1px solid var(--border); }
        .hero h1 { font-size: 3.5rem; margin-bottom: 1.5rem; color: var(--dark); font-weight: 800; line-height: 1.2; max-width: 900px; margin-left: auto; margin-right: auto; }
        .hero p { font-size: 1.2rem; color: var(--gray); margin-bottom: 2.5rem; max-width: 600px; margin-left: auto; margin-right: auto; }

        /* Contenedores Generales */
        .container { max-width: 1200px; margin: 0 auto; padding: 5rem 2rem; }
        .section-title { font-size: 2rem; margin-bottom: 3rem; text-align: center; font-weight: 800; }

        /* Tarjetas de Cursos (Catálogo Resumen) */
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 2rem; }
        .card { background: white; border: 1px solid var(--border); border-radius: 8px; padding: 2rem; }
        .card img { width: 100%; height: 220px; object-fit: cover; border-radius: 6px; margin-bottom: 1.5rem; }
        .card h3 { font-size: 1.5rem; margin-bottom: 1rem; display: flex; align-items: center; gap: 10px; }
        .card p { color: var(--gray); margin-bottom: 1.5rem; }
