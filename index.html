    <style>
        :root {
            --primary: #0284c7; 
            --primary-hover: #0369a1;
            --secondary: #f97316; 
            --secondary-hover: #ea580c;
            --dark: #0f172a;
            --light: #f8fafc;
            --gray: #64748b;
            --font-main: 'Inter', sans-serif;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: var(--font-main); scroll-behavior: smooth; }
        body { background-color: var(--light); color: var(--dark); line-height: 1.6; overflow-x: hidden; }

        /* Animaciones */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-up { 
    opacity: 1 !important; 
    transform: translateY(0) !important; 
    animation: none !important; 
}

        /* Navbar Profesional */
        header { background-color: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); box-shadow: 0 4px 20px rgba(0,0,0,0.05); position: sticky; top: 0; z-index: 1000; transition: var(--transition); }
        nav { max-width: 1200px; margin: 0 auto; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.8rem; font-weight: 800; color: var(--dark); text-decoration: none; display: flex; align-items: center; gap: 10px; letter-spacing: -0.5px; }
        .logo span { color: var(--primary); }
        .logo img { height: 40px; border-radius: 8px; }
        .nav-links { display: flex; gap: 2rem; align-items: center; }
        .nav-links a { text-decoration: none; color: var(--gray); font-weight: 600; transition: var(--transition); font-size: 0.95rem; }
        .nav-links a:hover { color: var(--primary); }
        
        /* Botones Globales */
        .btn { padding: 0.7rem 1.5rem; border-radius: 8px; font-weight: 600; text-decoration: none; cursor: pointer; border: none; transition: var(--transition); display: inline-flex; align-items: center; gap: 8px; font-size: 1rem; }
        .btn-outline { background: transparent; border: 2px solid var(--primary); color: var(--primary); }
        .btn-outline:hover { background: var(--primary); color: white; box-shadow: 0 4px 15px rgba(2, 132, 199, 0.3); }
        .btn-solid { background: var(--secondary); color: white; box-shadow: 0 4px 15px rgba(249, 115, 22, 0.3); }
        .btn-solid:hover { background: var(--secondary-hover); transform: translateY(-3px); box-shadow: 0 8px 25px rgba(249, 115, 22, 0.4); }

        /* Avatar Usuario */
        .user-avatar { width: 45px; height: 45px; background: linear-gradient(135deg, var(--primary), #3b82f6); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 1.2rem; cursor: pointer; box-shadow: 0 4px 10px rgba(2, 132, 199, 0.3); transition: var(--transition); position: relative; }
        .user-avatar:hover { transform: scale(1.05); }

        /* Hero Section */
        .hero { background: linear-gradient(135deg, rgba(15, 23, 42, 0.95), rgba(2, 132, 199, 0.9)), url('https://images.unsplash.com/photo-1581092921461-eab62e97a780?ixlib=rb-4.0.3&auto=format&fit=crop&w=2000&q=80') center/cover; color: white; padding: 10rem 2rem; text-align: center; position: relative; overflow: hidden; }
        .hero h1 { font-size: 4rem; margin-bottom: 1.5rem; max-width: 1000px; margin-inline: auto; line-height: 1.1; font-weight: 800; letter-spacing: -1px; }
        .hero p { font-size: 1.3rem; color: #cbd5e1; margin-bottom: 3rem; max-width: 700px; margin-inline: auto; }
        
        /* Secciones */
        .section-padding { padding: 6rem 2rem; max-width: 1200px; margin: 0 auto; }
        .section-title { font-size: 2.8rem; margin-bottom: 3.5rem; color: var(--dark); text-align: center; font-weight: 800; letter-spacing: -0.5px; }
        
        /* Estructura Grid */
        .course-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 3rem; }
        .course-card { background: white; border-radius: 16px; padding: 2.5rem; box-shadow: 0 10px 30px rgba(0,0,0,0.04); border-top: 6px solid var(--primary); transition: var(--transition); }
        .course-card:hover { transform: translateY(-10px); box-shadow: 0 20px 40px rgba(0,0,0,0.08); }
        .course-card img { width: 100%; border-radius: 12px; margin-bottom: 1.5rem; object-fit: cover; height: 200px; }
        .course-card h3 { font-size: 1.8rem; margin-bottom: 1.5rem; color: var(--dark); }
        
        /* Pricing / Planes */
        .pricing-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 2.5rem; align-items: center; }
        .pricing-card { background: white; border-radius: 16px; padding: 3rem 2rem; box-shadow: 0 10px 30px rgba(0,0,0,0.04); border: 1px solid #e2e8f0; transition: var(--transition); position: relative; display: flex; flex-direction: column; }
        .pricing-card:hover { transform: translateY(-10px); box-shadow: 0 20px 40px rgba(0,0,0,0.08); }
        .pricing-card.premium { border: 2px solid var(--primary); background: linear-gradient(to bottom, #ffffff, #f0f9ff); transform: scale(1.05); }
        .pricing-card.premium:hover { transform: scale(1.05) translateY(-10px); }
        .badge { position: absolute; top: -14px; left: 50%; transform: translateX(-50%); background: var(--primary); color: white; padding: 6px 16px; border-radius: 30px; font-size: 0.85rem; font-weight: 800; letter-spacing: 1px; box-shadow: 0 4px 10px rgba(2, 132, 199, 0.4); }
        .plan-price { font-size: 3rem; font-weight: 800; color: var(--dark); margin: 1rem 0 2rem; }
        .plan-price span { font-size: 1.2rem; color: var(--gray); font-weight: 600; }
        .plan-features li { margin-bottom: 1rem; color: var(--gray); display: flex; align-items: center; gap: 12px; font-size: 1.05rem; }
        .plan-features li i { color: var(--secondary); font-size: 1.2rem; }

        /* MODAL PASARELA DE PAGO (Checkout) */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(5px); z-index: 2000; display: none; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.3s ease; }
        .modal-overlay.active { display: flex; opacity: 1; }
        .checkout-modal { background: white; width: 100%; max-width: 500px; border-radius: 16px; padding: 2.5rem; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); transform: translateY(20px); transition: transform 0.3s ease; position: relative; }
        .modal-overlay.active .checkout-modal { transform: translateY(0); }
        .close-modal { position: absolute; top: 20px; right: 20px; font-size: 1.5rem; color: var(--gray); cursor: pointer; transition: color 0.3s; }
        .close-modal:hover { color: var(--dark); }
        .checkout-header { text-align: center; margin-bottom: 2rem; }
        .checkout-header h2 { font-size: 1.8rem; color: var(--dark); margin-bottom: 0.5rem; }
        .checkout-header p { color: var(--gray); }
