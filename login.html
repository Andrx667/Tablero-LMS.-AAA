<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - AMARAM TV</title>
    <style>
        body { font-family: sans-serif; margin: 0; background-color: #f9fafb; color: #333; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .auth-card { background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); width: 100%; max-width: 400px; border: 1px solid #eee; }
        h2 { text-align: center; color: #111; margin-bottom: 25px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 0.9rem; }
        .form-group input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; box-sizing: border-box; }
        .form-group input:focus { outline: none; border-color: #0ea5e9; box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.1); }
        .btn-auth { width: 100%; background: #0284c7; color: white; border: none; padding: 12px; font-size: 1rem; font-weight: bold; border-radius: 6px; cursor: pointer; transition: background 0.3s; }
        .btn-auth:hover { background: #0369a1; }
        .toggle-link { text-align: center; margin-top: 20px; font-size: 0.9rem; color: #666; }
        .toggle-link a { color: #0284c7; text-decoration: none; font-weight: 600; cursor: pointer; }
        .toggle-link a:hover { text-decoration: underline; }
        .volver { display: block; text-align: center; margin-top: 15px; font-size: 0.85rem; color: #888; text-decoration: none; }
        .volver:hover { color: #333; }
    </style>
</head>
<body>

    <div class="auth-card">
        <h2 id="tituloForm">Iniciar Sesión</h2>
        
        <form id="formAuth">
            <div class="form-group">
                <label>Correo Electrónico</label>
                <input type="email" id="email" required placeholder="tu@correo.com">
            </div>
            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn-auth" id="btnAccion">Ingresar</button>
        </form>

        <div class="toggle-link" id="textoToggle">
            ¿No tienes cuenta? <a id="linkCambiar" style="cursor: pointer;">Regístrate aquí</a>
        </div>

        <a href="index.html" class="volver">← Volver al inicio</a>
    </div>

    <!-- SDKs de Firebase versión 8 (Clásico) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <!-- Archivo de configuración -->
    <script src="js/firebase-config.js"></script>

    <!-- Lógica envuelta en DOMContentLoaded para evitar errores de elementos nulos -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            let esRegistro = false;

            const tituloForm = document.getElementById('tituloForm');
            const btnAccion = document.getElementById('btnAccion');
            const textoToggle = document.getElementById('textoToggle');
            const formAuth = document.getElementById('formAuth');

            window.cambiarModo = function() {
                esRegistro = !esRegistro;
                tituloForm.innerText = esRegistro ? "Crear Cuenta" : "Iniciar Sesión";
                btnAccion.innerText = esRegistro ? "Registrarse" : "Ingresar";
                textoToggle.innerHTML = esRegistro 
                    ? '¿Ya tienes cuenta? <a onclick="cambiarModo()" style="color:#0284c7; font-weight:600; cursor:pointer;">Inicia sesión</a>' 
                    : '¿No tienes cuenta? <a onclick="cambiarModo()" style="color:#0284c7; font-weight:600; cursor:pointer;">Regístrate aquí</a>';
            };

            // Asignar el evento al enlace de cambio de modo de forma segura
            const linkCambiar = document.getElementById('linkCambiar');
            if (linkCambiar) {
                linkCambiar.onclick = cambiarModo;
            }

            if (formAuth) {
                formAuth.addEventListener('submit', function(e) {
                    e.preventDefault();
                    const email = document.getElementById('email').value;
                    const password = document.getElementById('password').value;

                    if (typeof auth === 'undefined' || typeof db === 'undefined') {
                        alert("Error: Firebase no se ha inicializado correctamente.");
                        return;
                    }

                    if (esRegistro) {
                        auth.createUserWithEmailAndPassword(email, password)
                            .then((userCredential) => {
                                const user = userCredential.user;
                                return db.collection("users").doc(user.uid).set({
                                    email: email,
                                    role: "student",
                                    createdAt: new Date()
                                });
                            })
                            .then(() => {
                                alert("¡Cuenta creada con éxito! Bienvenido a AMARAM TV.");
                                window.location.href = "index.html";
                            })
                            .catch((error) => {
                                alert("Error en el registro: " + error.message);
                            });
                    } else {
                        auth.signInWithEmailAndPassword(email, password)
                            .then(() => {
                                alert("¡Inicio de sesión exitoso!");
                                window.location.href = "index.html";
                            })
                            .catch((error) => {
                                alert("Error al iniciar sesión: " + error.message);
                            });
                    }
                });
            }
        });
    </script>
</body>
</html>
