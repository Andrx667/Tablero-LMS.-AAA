<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingresar - AMARAM TV</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #0284c7; 
            --dark: #0f172a;
            --light: #f8fafc;
            --gray: #64748b;
            --border: #e2e8f0;
            --font-main: 'Inter', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: var(--font-main); }
        body { background-color: var(--light); color: var(--dark); line-height: 1.6; display: flex; flex-direction: column; min-height: 100vh; }
        
        header { background-color: white; border-bottom: 1px solid var(--border); padding: 1rem 0; }
        nav { max-width: 1200px; margin: 0 auto; padding: 0 2rem; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.5rem; font-weight: 800; color: var(--dark); text-decoration: none; display: flex; align-items: center; gap: 10px; }
        .logo img { height: 40px; border-radius: 6px; } 
        .logo span { color: var(--primary); }

        .auth-container { flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem; }
        .auth-card { background: white; border: 1px solid var(--border); border-radius: 12px; padding: 2.5rem; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        
        .auth-card h2 { font-size: 1.8rem; margin-bottom: 0.5rem; color: var(--dark); text-align: center; }
        .auth-card p { color: var(--gray); margin-bottom: 2rem; text-align: center; font-size: 0.95rem; }

        .form-group { margin-bottom: 1.2rem; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 0.5rem; font-size: 0.9rem; }
        .form-group input { width: 100%; padding: 0.8rem; border: 1px solid var(--border); border-radius: 6px; font-size: 1rem; }
        .form-group input:focus { outline: none; border-color: var(--primary); }

        .btn-solid { background: var(--primary); color: white; border: 2px solid var(--primary); padding: 0.8rem; border-radius: 6px; font-weight: 600; width: 100%; cursor: pointer; font-size: 1rem; }
        .btn-solid:hover { background: #0369a1; border-color: #0369a1; }
        
        .toggle-form { text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--gray); }
        .toggle-form span { color: var(--primary); font-weight: 600; cursor: pointer; }
        
        .error-msg { background: #ffeeec; color: #dc2626; padding: 0.8rem; border-radius: 6px; font-size: 0.85rem; margin-top: 1rem; text-align: center; display: none; border: 1px solid #fca5a5; }
    </style>
</head>
<body>

    <header>
        <nav>
            <a href="index.html" class="logo">
                <img src="img/logo%20amaram.jpg" alt="Logo AMARAM TV" onerror="this.src='https://via.placeholder.com/40'">
                AMARAM <span>TV</span>
            </a>
            <a href="index.html" style="color: var(--gray); text-decoration: none; font-weight: 600;"><i class="fa-solid fa-arrow-left"></i> Volver al inicio</a>
        </nav>
    </header>

    <div class="auth-container">
        <div class="auth-card">
            <h2 id="authTitle">Iniciar Sesión</h2>
            <p id="authSubtitle">Accede a tus cursos y herramientas</p>

            <form id="authForm" onsubmit="procesarAuth(event)">
                <div class="form-group">
                    <label>Correo Electrónico</label>
                    <input type="email" id="email" required placeholder="tu@correo.com">
                </div>
                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>
                
                <button type="submit" class="btn-solid" id="authBtn">Ingresar</button>
                <div class="error-msg" id="errorMsg"></div>
            </form>

            <div class="toggle-form">
                <span id="toggleText">¿No tienes cuenta? <span onclick="cambiarModo()">Regístrate aquí</span></span>
            </div>
        </div>
    </div>

    <!-- SDKs de Firebase v8 -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    
    <!-- TU ARCHIVO DE CONFIGURACIÓN -->
    <script src="js/firebase-config.js"></script> 

    <script>
        let esRegistro = false;

        function cambiarModo() {
            esRegistro = !esRegistro;
            document.getElementById('authTitle').innerText = esRegistro ? "Crear Cuenta" : "Iniciar Sesión";
            document.getElementById('authSubtitle').innerText = esRegistro ? "Únete a AMARAM TV" : "Accede a tus cursos y herramientas";
            document.getElementById('authBtn').innerText = esRegistro ? "Registrarse" : "Ingresar";
            document.getElementById('toggleText').innerHTML = esRegistro 
                ? '¿Ya tienes cuenta? <span onclick="cambiarModo()" style="color:var(--primary); font-weight:600; cursor:pointer;">Inicia sesión</span>'
                : '¿No tienes cuenta? <span onclick="cambiarModo()" style="color:var(--primary); font-weight:600; cursor:pointer;">Regístrate aquí</span>';
            document.getElementById('errorMsg').style.display = 'none';
        }

        function procesarAuth(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const btn = document.getElementById('authBtn');
            const errorMsg = document.getElementById('errorMsg');
            
            errorMsg.style.display = 'none';

            if (typeof auth === 'undefined') {
                errorMsg.style.display = 'block';
                errorMsg.innerText = "Error: La variable 'auth' no está definida en firebase-config.js";
                return;
            }

            btn.innerText = "Procesando...";
            btn.disabled = true;

            if (esRegistro) {
                // REGISTRO
                auth.createUserWithEmailAndPassword(email, password)
                    .then((userCredential) => {
                        window.location.href = 'catalogo.html';
                    })
                    .catch((error) => {
                        mostrarError(error);
                        btn.innerText = "Registrarse";
                        btn.disabled = false;
                    });
            } else {
                // INICIO DE SESIÓN
                auth.signInWithEmailAndPassword(email, password)
                    .then((userCredential) => {
                        window.location.href = 'catalogo.html';
                    })
                    .catch((error) => {
                        mostrarError(error);
                        btn.innerText = "Ingresar";
                        btn.disabled = false;
                    });
            }
        }

        function mostrarError(error) {
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.style.display = 'block';
            
            const codigo = error.code;
            if (codigo === 'auth/user-not-found' || codigo === 'auth/wrong-password' || codigo === 'auth/invalid-credential') {
                errorMsg.innerText = "Correo o contraseña incorrectos.";
            } else if (codigo === 'auth/email-already-in-use') {
                errorMsg.innerText = "Este correo ya está registrado. Intenta iniciar sesión.";
            } else if (codigo === 'auth/weak-password') {
                errorMsg.innerText = "La contraseña debe tener al menos 6 caracteres.";
            } else if (codigo === 'auth/invalid-email') {
                errorMsg.innerText = "El formato del correo electrónico no es válido.";
            } else {
                errorMsg.innerText = "Error: " + error.message;
            }
        }
    </script>
</body>
</html>
