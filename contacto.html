<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Más Información - AMARAM TV</title>
    <style>
        body { font-family: sans-serif; margin: 0; background-color: #f9fafb; color: #333; }
        
        /* Header */
        .header-nav { display: flex; justify-content: space-between; align-items: center; padding: 15px 5%; background: #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .header-nav img { height: 40px; vertical-align: middle; }
        .header-nav a { text-decoration: none; color: #333; font-weight: 600; margin-left: 20px; }
        
        /* Contenedor del Formulario */
        .contacto-container { max-width: 600px; margin: 50px auto; background: #fff; padding: 40px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); border: 1px solid #eee; }
        h1 { color: #111; margin-top: 0; font-size: 1.8rem; text-align: center; }
        p.subtitulo { text-align: center; color: #666; margin-bottom: 30px; }

        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 8px; color: #111; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; box-sizing: border-box; }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: #0ea5e9; box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.1); }

        /* Casilla de autorización (Check) */
        .checkbox-group { display: flex; align-items: flex-start; gap: 10px; margin-top: 25px; }
        .checkbox-group input { width: 18px; height: 18px; margin-top: 2px; cursor: pointer; }
        .checkbox-group label { font-size: 0.9rem; color: #555; font-weight: normal; line-height: 1.4; cursor: pointer; }

        .btn-enviar { background: #f97316; color: white; border: none; width: 100%; padding: 14px; font-size: 1.1rem; font-weight: bold; border-radius: 6px; cursor: pointer; transition: background 0.3s; margin-top: 25px; }
        .btn-enviar:hover { background: #ea580c; }

        footer { text-align: center; padding: 20px; background: #111; color: #fff; margin-top: 60px; }
    </style>
</head>
<body>

    <header class="header-nav">
        <a href="https://andrx667.github.io/AMARAM-TV.inc-/">
            <img src="img/logo amaram.jpg" alt="AMARAM TV Logo">
        </a>
        <nav>
            <a href="https://andrx667.github.io/AMARAM-TV.inc-/">Inicio</a>
            <a href="catalogo.html">Catálogo</a>
        </nav>
    </header>

    <div class="contacto-container">
        <h1>¿Quieres más información?</h1>
        <p class="subtitulo">Déjanos tus datos y un asesor se pondrá en contacto contigo para resolver todas tus dudas sobre nuestros programas técnicos.</p>

        <form id="formLead">
            <div class="form-group">
                <label for="nombre">Nombre Completo *</label>
                <input type="text" id="nombre" required placeholder="Ej. Carlos Pérez">
            </div>

            <div class="form-group">
                <label for="correo">Correo Electrónico *</label>
                <input type="email" id="correo" required placeholder="tucorreo@email.com">
            </div>

            <div class="form-group">
                <label for="telefono">Número de Celular / WhatsApp</label>
                <input type="tel" id="telefono" placeholder="Ej. 3001234567">
            </div>

            <div class="form-group">
                <label for="cursoInteres">Curso de Interés</label>
                <select id="cursoInteres">
                    <option value="aires">Curso Completo de Aires Mini Split</option>
                    <option value="tvs">Montaje de Smart TVs</option>
                    <option value="ambos">Ambos programas</option>
                </select>
            </div>

            <!-- Casilla de Autorización obligatoria (Criterio de aceptación) -->
            <div class="checkbox-group">
                <input type="checkbox" id="autorizacion" required>
                <label for="autorizacion">Autorizo el tratamiento de mis datos personales de acuerdo con la política de privacidad y protección de datos para recibir información sobre los cursos de AMARAM TV.</label>
            </div>

            <button type="submit" class="btn-enviar">Enviar Solicitud</button>
        </form>
    </div>

    <footer>
        <p>© 2026 AMARAM TV. Todos los derechos reservados.</p>
    </footer>

    <script>
        // Validación básica de envío (Más adelante en el Sprint 2 esto se conectará a Firebase / colección 'leads')
        document.getElementById('formLead').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const nombre = document.getElementById('nombre').value;
            const correo = document.getElementById('correo').value;
            const autorizado = document.getElementById('autorizacion').checked;

            if(!autorizado) {
                alert("Debes autorizar el tratamiento de datos para continuar.");
                return;
            }

            alert(`¡Gracias ${nombre}! Hemos recibido tu información. Te contactaremos pronto al correo ${correo}.`);
            document.getElementById('formLead').reset();
        });
    </script>
<!-- Script para conectar el formulario con Firestore -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const formLead = document.getElementById('formLead');
            if (formLead) {
                formLead.addEventListener('submit', function(e) {
                    e.preventDefault();
                    
                    const nombre = document.getElementById('nombre').value;
                    const email = document.getElementById('correo').value; // Coincide con tu id="correo"
                    const telefono = document.getElementById('telefono').value; 
                    const cursoInteres = document.getElementById('cursoInteres').value; 
                    const btnEnviar = document.querySelector('button[type="submit"]');

                    if (btnEnviar) {
                        btnEnviar.innerText = "Enviando solicitud...";
                        btnEnviar.disabled = true;
                    }

                    // Guarda el lead en Firestore con etapa 'nuevo' y origen 'formulario web'
                    db.collection("leads").add({
                        nombre: nombre,
                        email: email,
                        telefono: telefono,
                        cursoInteres: cursoInteres,
                        etapa: "nuevo",
                        origen: "formulario web",
                        createdAt: new Date()
                    })
                    .then(() => {
                        alert("¡Solicitud enviada con éxito! Un asesor se pondrá en contacto contigo.");
                        formLead.reset();
                        if (btnEnviar) {
                            btnEnviar.innerText = "Enviar Solicitud";
                            btnEnviar.disabled = false;
                        }
                    })
                    .catch((error) => {
                        console.error("Error al guardar el lead:", error);
                        alert("Hubo un error al enviar la solicitud. Inténtalo de nuevo.");
                        if (btnEnviar) {
                            btnEnviar.innerText = "Enviar Solicitud";
                            btnEnviar.disabled = false;
                        }
                    });
                });
            }
        });
    </script>
</body>
</html>
